name: devops-journey-workflow
on:
    push:
        branches: [main]
    pull_request:
jobs:
    simple-job:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-python@v7
              with:
                python-version: "3.12"
            - name: show-files-directories
              run: ls
            - name: show-python-version
              run: python3 --version
            - name: install-required-files-programs
              working-directory: projects/visit-counter/
              run: pip install -r requirements.txt pytest
            - name: pytest
              working-directory: projects/visit-counter/
              run: pytest

    build-image:
        needs: simple-job
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7.0.1
            - name: log in to GHCR
              if: github.event_name == 'push'
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: build the image (no push yet)
              uses: docker/build-push-action@v7.4.0
              with:
                context: projects/visit-counter
                load: true
                push: false
                tags: ghcr.io/rayyan98dev/visit-counter:${{ github.sha }}
            - name: scan the image
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
              with:
                image-ref: ghcr.io/rayyan98dev/visit-counter:${{ github.sha }}
                severity: 'HIGH,CRITICAL'
                ignore-unfixed: true
                exit-code: '1'
            - name: push the image
              if: github.event_name == 'push'
              run: docker push ghcr.io/rayyan98dev/visit-counter:${{ github.sha }}
