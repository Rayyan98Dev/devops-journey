name: devops-journey-workflow
on:
    push:
        branches: [main]
    pull_request:
jobs:
    simple-job:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-python@v7
              with:
                python-version: "3.12"
            - name: show-files-directories
              run: ls
            - name: show-python-version
              run: python3 --version
            - name: install-required-files-programs
              working-directory: projects/visit-counter/
              run: pip install -r requirements.txt pytest
            - name: pytest
              working-directory: projects/visit-counter/
              run: pytest

    build-image:
        needs: simple-job
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7.0.1
            - name: log in to GHCR
              if: github.event_name == 'push'
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: build, and push only when allowed
              uses: docker/build-push-action@v7
              with:
                context: projects/visit-counter
                push: ${{ github.event_name == 'push' }}
                tags: ghcr.io/rayyan98dev/visit-counter:${{ github.sha }}
