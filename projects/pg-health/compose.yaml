services:
  pg-test:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s #time between checks
      timeout: 3s #time given to perform each check
      retries: 3 #number of checks that can be performed
      start_period: 5s #time for the program to boot