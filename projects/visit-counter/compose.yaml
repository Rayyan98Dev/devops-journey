services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:${HOST_PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      REDIS_HOST: ${REDIS_HOST}
    depends_on:
      redis:
          condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    secrets:
      - api_key
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    user: redis
    volumes:
      - redis-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

volumes:
  redis-data:

secrets:
  api_key:
    file: ./secrets/api_key.txt
