services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - redis
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
  redis:
    image: redis:7
    user: redis
    volumes:
      - redis-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

volumes:
  redis-data:
